<div class="mobile-nav-main">
  <button
    class="menu-button"
    mat-icon-button
    [matMenuTriggerFor]="menu"
    aria-label="Zephyr Mobil Navigáció Menü"
  >
    <mat-icon class="menu-button-icon">menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <a
      mat-menu-item
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      >Főoldal</a
    >
    <a mat-menu-item routerLink="/hirek" routerLinkActive="active-link"
      >Hírek</a
    >
    <a mat-menu-item routerLink="/ajanlatok" routerLinkActive="active-link"
      >Ajánlatok</a
    >
    <button
      mat-menu-item
      [matMenuTriggerFor]="integra"
      (click)="handleIntegraMenuClick()"
    >
      Integra
    </button>
    <button
      mat-menu-item
      [matMenuTriggerFor]="kb"
      (click)="handleKbMenuClick()"
    >
      Tudásbázis
    </button>
    <button mat-menu-item>Árajánlat kérése</button>
  </mat-menu>

  <mat-menu #integra="matMenu">
    <a mat-menu-item routerLink="/integra/tajekoztato">Tájékoztató</a>
    <a mat-menu-item routerLink="/integra/probaverzio">Próbaverzió</a>
    <a mat-menu-item routerLink="/integra/dokumentacio">Dokumentáció</a>
    <a mat-menu-item routerLink="/integra/programfrissites">Programfrissítés</a>
    <a mat-menu-item routerLink="/integra/egyeb">Egyéb dokumentumok</a>
  </mat-menu>

  <mat-menu #kb="matMenu">
    <a mat-menu-item>Cikkek</a>
    <a mat-menu-item>Hasznos linkek</a>
  </mat-menu>
</div>
