<div data-testid="admin-tags-component" class="admin-tags-component">
  <h1>Tudásbázis címkék</h1>

  @if (errorMessage()) {
    <app-form-unexpected-error />
  } @else if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (isEmpty()) {
    <p>Még nincsenek címkék.</p>
  } @else {
    @if (deleteErrorMessage() || renameErrorMessage()) {
      <app-form-unexpected-error />
    }

    <div class="admin-tags-grid">
      <ag-grid-angular
        [theme]="theme"
        [modules]="gridModules"
        domLayout="autoHeight"
        [rowData]="tags()"
        [columnDefs]="columnDefinitions"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPanels]="paginationPanels"
        [paginationPageSizeSelector]="[25, 50, 100]"
      />
    </div>
  }
</div>
