<div data-testid="admin-links-component" class="admin-links-component">
  <div class="admin-links-header">
    <h1>Linkek kezelése</h1>
    <a mat-flat-button routerLink="/admin/linkek/uj">Új link felvétele</a>
    <a mat-button routerLink="/admin/linkek/kategoriak">Kategóriák</a>
  </div>

  @if (errorMessage()) {
    <app-form-unexpected-error />
  } @else if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (isEmpty()) {
    <p>Még nincsenek linkek az oldalon.</p>
  } @else {
    @if (deleteErrorMessage()) {
      <app-form-unexpected-error />
    }

    <div class="admin-links-grid">
      <ag-grid-angular
        [theme]="theme"
        [modules]="gridModules"
        domLayout="autoHeight"
        [rowData]="links()"
        [columnDefs]="columnDefinitions"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPanels]="paginationPanels"
        [paginationPageSizeSelector]="[25, 50, 100]"
      />
    </div>
  }
</div>
