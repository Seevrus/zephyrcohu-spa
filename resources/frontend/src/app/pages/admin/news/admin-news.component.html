<div data-testid="admin-news-component" class="admin-news-component">
  <div class="admin-news-header">
    <h1>Hírek kezelése</h1>
    <a mat-flat-button routerLink="/admin/hirek/uj">Új hír írása</a>
  </div>

  @if (errorMessage()) {
    <app-form-unexpected-error />
  } @else if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (isEmpty()) {
    <p>Még nincsenek hírek az oldalon.</p>
  } @else {
    @if (deleteErrorMessage()) {
      <app-form-unexpected-error />
    }

    <mat-form-field class="admin-news-search">
      <mat-label>Keresés cím szerint</mat-label>
      <input
        matInput
        type="search"
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </mat-form-field>

    <div class="admin-news-grid">
      <ag-grid-angular
        [theme]="theme"
        [modules]="gridModules"
        domLayout="autoHeight"
        [rowData]="filteredNews()"
        [columnDefs]="columnDefinitions"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPanels]="paginationPanels"
        [paginationPageSizeSelector]="[25, 50, 100]"
      />
    </div>
  }
</div>
