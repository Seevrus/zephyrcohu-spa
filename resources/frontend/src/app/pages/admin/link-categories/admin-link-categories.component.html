<div
  data-testid="admin-link-categories-component"
  class="admin-link-categories-component"
>
  <div class="admin-link-categories-header">
    <h1>Link kategóriák</h1>
    <a mat-button routerLink="/admin/linkek">Vissza a linkekhez</a>
  </div>

  @if (errorMessage()) {
    <app-form-unexpected-error />
  } @else if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (isEmpty()) {
    <p>Még nincsenek kategóriák.</p>
  } @else {
    @if (deleteErrorMessage() || renameErrorMessage()) {
      <app-form-unexpected-error />
    }

    <div class="admin-link-categories-grid">
      <ag-grid-angular
        [theme]="theme"
        [modules]="gridModules"
        domLayout="autoHeight"
        [rowData]="categories()"
        [columnDefs]="columnDefinitions"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPanels]="paginationPanels"
        [paginationPageSizeSelector]="[25, 50, 100]"
      />
    </div>
  }
</div>
