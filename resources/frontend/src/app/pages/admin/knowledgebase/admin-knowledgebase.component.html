<div
  data-testid="admin-knowledgebase-component"
  class="admin-knowledgebase-component"
>
  <div class="admin-knowledgebase-header">
    <h1>Tudásbázis cikkek</h1>
    <a mat-flat-button routerLink="/admin/tudasbazis/uj">Új cikk írása</a>
    <a mat-button routerLink="/admin/tudasbazis/cimkek">Címkék kezelése</a>
  </div>

  @if (errorMessage()) {
    <app-form-unexpected-error />
  } @else if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (isEmpty()) {
    <p>Még nincsenek tudásbázis cikkek az oldalon.</p>
  } @else {
    @if (deleteErrorMessage()) {
      <app-form-unexpected-error />
    }

    <mat-form-field class="admin-knowledgebase-search">
      <mat-label>Keresés cím szerint</mat-label>
      <input
        matInput
        type="search"
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </mat-form-field>

    <div class="admin-knowledgebase-grid">
      <ag-grid-angular
        [theme]="theme"
        [modules]="gridModules"
        domLayout="autoHeight"
        [rowData]="filteredKnowledgebase()"
        [columnDefs]="columnDefinitions"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPanels]="paginationPanels"
        [paginationPageSizeSelector]="[25, 50, 100]"
      />
    </div>
  }
</div>
