<div
  data-testid="admin-newsletters-component"
  class="admin-newsletters-component"
>
  <div class="admin-newsletters-header">
    <h1>Kiküldött hírlevelek</h1>
    <a mat-flat-button routerLink="/admin/hirlevel/uj">Új hírlevél írása</a>
  </div>

  @if (errorMessage()) {
    <app-form-unexpected-error />
  } @else if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (isEmpty()) {
    <p>Még egyetlen hírlevél sem került elküldésre.</p>
  } @else {
    <div class="admin-newsletters-grid">
      <ag-grid-angular
        [theme]="theme"
        [modules]="gridModules"
        domLayout="autoHeight"
        [rowData]="newsletters()"
        [columnDefs]="columnDefinitions"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPanels]="paginationPanels"
        [paginationPageSizeSelector]="[25, 50, 100]"
      />
    </div>
  }
</div>
