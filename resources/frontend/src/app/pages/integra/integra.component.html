<div data-testid="integra-component" class="integra-component">
  <div class="integra-grid">
    <ag-grid-angular
      [autoSizeStrategy]="autoSizeStrategy"
      [theme]="theme"
      domLayout="autoHeight"
      [rowData]="documents()"
      [columnDefs]="integraColumnDefinitions"
      [localeText]="localeText"
      [pagination]="true"
      [paginationPanels]="paginationPanels"
      [paginationPageSizeSelector]="[10, 25, 50, 100]"
    />
  </div>
</div>
